<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-white/75 px-4 backdrop-blur"
  role="status"
  aria-live="polite"
>
  <div class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white px-6 py-6 text-center shadow-xl">
    <div class="mx-auto h-11 w-11 animate-spin rounded-full border-4 border-slate-200 border-t-orange-500"></div>
    <p class="mt-4 text-sm font-semibold text-slate-900">{{ message }}</p>
    <p *ngIf="subMessage" class="mt-1 text-xs text-slate-500">{{ subMessage }}</p>
    <div *ngIf="showProgress" class="mt-4 h-1 w-full overflow-hidden rounded-full bg-slate-100">
      <div class="h-1 w-1/2 animate-pulse rounded-full bg-orange-400"></div>
    </div>
  </div>
</div>
