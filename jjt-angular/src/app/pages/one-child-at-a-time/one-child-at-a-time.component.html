<app-site-header></app-site-header>

<app-ramadan-loader
  *ngIf="loading"
  message="Preparing a child for you..."
></app-ramadan-loader>

<div class="relative min-h-screen overflow-hidden bg-[#0B1512] py-10 text-amber-100">
  <div class="pointer-events-none absolute inset-0">
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(255,214,153,0.18),_rgba(8,19,16,0.92)_60%,_rgba(6,12,10,1)_100%)]"></div>
    <div class="absolute inset-0 opacity-30" style="background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px); background-size: 32px 32px;"></div>
    <div class="wall-glow-a absolute -top-40 right-[-10%] h-[420px] w-[420px] rounded-full bg-amber-300/30 blur-[140px]"></div>
    <div class="wall-glow-b absolute -bottom-40 left-[-10%] h-[520px] w-[520px] rounded-full bg-emerald-400/20 blur-[160px]"></div>
    <svg class="absolute left-10 top-24 h-36 w-36 opacity-60" viewBox="0 0 140 140" aria-hidden="true">
      <defs>
        <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFE7B0" stop-opacity="0.8" />
          <stop offset="70%" stop-color="#FFD48A" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#0B1512" stop-opacity="0" />
        </radialGradient>
      </defs>
      <circle cx="70" cy="70" r="48" fill="url(#moonGlow)" />
      <path d="M92 32c-18 2-32 18-32 36 0 20 16 36 36 36 7 0 13-2 18-5-7 9-18 14-31 14-22 0-40-18-40-40 0-21 16-38 37-41 4 0 8 0 12 0z" fill="#FFD38F" />
    </svg>
    <svg class="absolute bottom-0 left-0 right-0 h-40 w-full opacity-40" viewBox="0 0 1200 240" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 200L120 180L240 190L360 160L480 170L600 140L720 160L840 145L960 170L1080 150L1200 170V240H0Z" fill="#1F332C"/>
      <path d="M90 200h30v40H90zM140 170h36v70h-36zM210 190h28v50h-28zM310 175h32v65h-32zM420 185h40v55h-40zM520 165h34v75h-34zM650 185h38v55h-38zM760 170h32v70h-32zM870 190h30v50h-30zM980 175h36v65h-36zM1100 188h40v52h-40z" fill="#15241E"/>
    </svg>
    <svg class="absolute left-6 top-1/3 h-28 w-20 opacity-80" viewBox="0 0 80 120" fill="none" aria-hidden="true">
      <path d="M40 6c12 8 20 18 20 28 0 18-16 26-20 54-4-28-20-36-20-54 0-10 8-20 20-28z" fill="#C89B4B"/>
      <path d="M22 36h36v52H22z" fill="#F4D38C"/>
      <circle cx="40" cy="64" r="10" fill="#FFE7B0"/>
      <rect x="32" y="88" width="16" height="22" rx="6" fill="#C89B4B"/>
    </svg>
    <svg class="absolute right-8 top-1/4 h-28 w-20 opacity-80" viewBox="0 0 80 120" fill="none" aria-hidden="true">
      <path d="M40 6c12 8 20 18 20 28 0 18-16 26-20 54-4-28-20-36-20-54 0-10 8-20 20-28z" fill="#C89B4B"/>
      <path d="M22 36h36v52H22z" fill="#F4D38C"/>
      <circle cx="40" cy="64" r="10" fill="#FFE7B0"/>
      <rect x="32" y="88" width="16" height="22" rx="6" fill="#C89B4B"/>
    </svg>
  </div>

  <div class="relative mx-auto flex max-w-5xl flex-col gap-7 px-4">
    <app-hero-banner [headline]="heroHeadline" [subtext]="heroSubtext"></app-hero-banner>

    <div *ngIf="error" class="rounded border border-red-200 bg-red-50 px-4 py-3 text-red-700">
      {{ error }}
    </div>

    <div
      class="rounded-2xl border border-amber-300/60 bg-gradient-to-r from-[#2E4A3B] via-[#1E3227] to-[#2E4A3B] px-4 py-3 text-center text-sm font-semibold text-amber-100 shadow-[0_10px_30px_rgba(15,23,18,0.45)]"
    >
      🌙 Ramadan Special: Sponsor before Laylatul Qadr and multiply your rewards.
    </div>

    <app-single-child-focus-card
      *ngIf="!loading && !error"
      [child]="currentChild"
      [animate]="animateCard"
    ></app-single-child-focus-card>

    <app-child-decision-actions
      *ngIf="!loading && !error"
      (sponsor)="sponsorCurrent()"
      (showAnother)="showAnother()"
    ></app-child-decision-actions>

    <app-trust-signals></app-trust-signals>
  </div>
</div>

<app-site-footer></app-site-footer>
