<app-site-header></app-site-header>

<app-ramadan-loader
  *ngIf="loading"
  message="Preparing a child for you..."
></app-ramadan-loader>

<div class="relative min-h-screen overflow-hidden bg-[#EAF4FB] py-10">
  <div class="pointer-events-none absolute inset-0">
    <div class="wall-glow-a absolute -top-40 right-[-10%] h-[420px] w-[420px] rounded-full bg-sky-200/60 blur-[120px]"></div>
    <div class="wall-glow-b absolute -bottom-40 left-[-10%] h-[520px] w-[520px] rounded-full bg-cyan-200/60 blur-[130px]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_rgba(255,255,255,0.8),_rgba(234,244,251,0.2)_45%,_rgba(226,240,249,0.6)_100%)]"></div>
  </div>

  <div class="relative mx-auto flex max-w-4xl flex-col gap-6 px-4">
    <app-hero-banner [subtext]="heroSubtext"></app-hero-banner>

    <div *ngIf="error" class="rounded border border-red-200 bg-red-50 px-4 py-3 text-red-700">
      {{ error }}
    </div>

    <app-single-child-focus-card
      *ngIf="!loading && !error"
      [child]="currentChild"
      [animate]="animateCard"
    ></app-single-child-focus-card>

    <app-child-decision-actions
      *ngIf="!loading && !error"
      (sponsor)="sponsorCurrent()"
      (showAnother)="showAnother()"
    ></app-child-decision-actions>

    <app-trust-signals></app-trust-signals>
  </div>
</div>

<app-site-footer></app-site-footer>
