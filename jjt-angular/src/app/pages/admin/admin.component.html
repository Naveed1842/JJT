<div class="admin-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">JJT</span>
      <span class="brand-text">Admin</span>
    </div>
    <p-panelMenu [model]="menuItems" [multiple]="true"></p-panelMenu>
  </aside>

  <section class="main">
    <header class="topbar">
      <div class="role-chip">
        <span class="muted">Role</span>
        <p-tag [value]="role" severity="info"></p-tag>
      </div>
      <div class="top-actions">
        <button pButton type="button" label="Public Site" icon="pi pi-home" class="p-button-text" routerLink="/"></button>
        <button pButton type="button" label="Logout" icon="pi pi-sign-out" class="p-button-outlined" (click)="logout()"></button>
      </div>
    </header>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </section>
</div>
