<div class="min-h-screen bg-amber-50 py-12">
  <div class="max-w-6xl mx-auto px-4">
    <h1 class="text-4xl font-bold text-gray-800 mb-8 font-serif">My Sponsored Children</h1>

    <div *ngIf="loading" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-orange-500"></div>
      <p class="mt-4 text-gray-600">Loading your sponsored children...</p>
    </div>

    <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
      {{ error }}
    </div>

    <div *ngIf="!loading && !error" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let child of children" 
           class="paper-texture p-6 rounded-lg shadow-lg hover:shadow-xl transition-shadow">
        <div class="mb-4">
          <div class="w-full h-48 bg-gradient-to-br from-orange-200 to-amber-300 rounded-lg flex items-center justify-center">
            <span class="text-6xl">👦</span>
          </div>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2 font-serif">{{ child.name }}</h2>
        <div class="space-y-2 text-gray-700">
          <p><span class="font-semibold">Birth Date:</span> {{ child.birthDate }}</p>
          <p><span class="font-semibold">Grade:</span> {{ child.currentGrade }}</p>
          <p><span class="font-semibold">Status:</span> 
            <span class="px-2 py-1 rounded text-sm bg-green-100 text-green-800">
              {{ child.sponsorshipStatus }}
            </span>
          </p>
        </div>
        <a [routerLink]="['/children', child.childId]" 
           class="btn-orange inline-block mt-4 text-center w-full">
          View Progress & Details
        </a>
      </div>
    </div>

    <div *ngIf="!loading && !error && children.length === 0" 
         class="text-center py-12">
      <div class="paper-texture p-12 rounded-lg shadow-lg inline-block">
        <p class="text-xl text-gray-600 mb-4">You haven't sponsored any children yet.</p>
        <a routerLink="/children" class="btn-orange inline-block">
          Browse Children
        </a>
      </div>
    </div>
  </div>
</div>
