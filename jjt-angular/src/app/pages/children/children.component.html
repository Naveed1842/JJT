<app-site-header></app-site-header>
<div class="min-h-screen bg-slate-50 paper-texture py-12">
  <div class="mx-auto max-w-6xl px-4">
    <h1 class="text-3xl font-semibold text-slate-900">Children</h1>
    <p class="mt-2 text-sm text-slate-600">
      Browse children available for sponsorship. Information is read-only.
    </p>

    <div *ngIf="loading" class="py-12 text-center">
      <div class="inline-block h-12 w-12 animate-spin rounded-full border-b-2 border-slate-900"></div>
      <p class="mt-4 text-slate-600">Loading children...</p>
    </div>

    <div *ngIf="error" class="mb-4 rounded border border-red-200 bg-red-50 px-4 py-3 text-red-700">
      {{ error }}
    </div>

    <div *ngIf="!loading && !error" class="mt-8 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
      <app-child-card *ngFor="let child of children" [child]="child" />
    </div>

    <div *ngIf="!loading && !error && children.length === 0" class="py-12 text-center text-slate-600">
      <p class="text-xl">No children found.</p>
    </div>
  </div>
</div>
<app-site-footer></app-site-footer>
