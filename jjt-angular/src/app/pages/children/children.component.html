<div class="min-h-screen bg-amber-50 py-12">
  <div class="max-w-6xl mx-auto px-4">
    <h1 class="text-4xl font-bold text-gray-800 mb-8 font-serif">Our Children</h1>

    <div *ngIf="loading" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-orange-500"></div>
      <p class="mt-4 text-gray-600">Loading children...</p>
    </div>

    <div *ngIf="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
      {{ error }}
    </div>

    <div *ngIf="!loading && !error" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let child of children" 
           class="paper-texture p-6 rounded-lg shadow-lg hover:shadow-xl transition-shadow">
        <h2 class="text-2xl font-bold text-gray-800 mb-2 font-serif">{{ child.fullName }}</h2>
        <div class="space-y-2 text-gray-700">
          <p><span class="font-semibold">Education Amount:</span> {{ child.educationAmount }} {{ child.educationCurrency }}</p>
          <p class="text-sm text-gray-600">ID: {{ child.id }}</p>
        </div>
        <a [routerLink]="['/children', child.id]" 
           class="btn-orange inline-block mt-4 text-center">
          View Details
        </a>
      </div>
    </div>

    <div *ngIf="!loading && !error && children.length === 0" 
         class="text-center py-12 text-gray-600">
      <p class="text-xl">No children found.</p>
    </div>
  </div>
</div>
