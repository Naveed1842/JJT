<div class="min-h-screen flex flex-col">
  <app-site-header></app-site-header>

  <!-- Login Section -->
  <section class="flex-1 paper-texture flex items-center justify-center px-6 py-16">
    <div class="w-full max-w-md">
      <!-- Login Card -->
      <div class="bg-white rounded-lg shadow-xl border border-gray-200 overflow-hidden">
        <!-- Header -->
        <div class="bg-slate-950 text-white px-8 py-6 text-center">
          <div class="flex items-center justify-center mb-3">
            <div class="h-12 w-12 rounded-full bg-orange-600 flex items-center justify-center">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </div>
          </div>
          <h1 class="text-2xl font-bold">Welcome Back</h1>
          <p class="text-sm text-gray-300 mt-1">Sign in to continue to JJT Platform</p>
        </div>

        <!-- Form -->
        <form (ngSubmit)="onSubmit()" class="px-8 py-8">
          <!-- Username Field -->
          <div class="mb-6">
            <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">
              Username
            </label>
            <input
              type="text"
              id="username"
              name="username"
              [(ngModel)]="username"
              required
              [disabled]="isLoading"
              placeholder="Enter your username"
              class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all"
            />
          </div>

          <!-- Password Field -->
          <div class="mb-6">
            <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
              Password
            </label>
            <input
              type="password"
              id="password"
              name="password"
              [(ngModel)]="password"
              required
              [disabled]="isLoading"
              placeholder="Enter your password"
              class="w-full px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all"
            />
          </div>

          <!-- Error Message -->
          <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-md">
            <p class="text-sm text-red-800 flex items-center">
              <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
              </svg>
              {{ errorMessage }}
            </p>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            [disabled]="isLoading"
            class="w-full py-3 px-4 bg-orange-600 hover:bg-orange-700 text-white font-bold rounded-md transition-all transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
          >
            <span *ngIf="!isLoading" class="flex items-center justify-center">
              <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
              </svg>
              Sign In
            </span>
            <span *ngIf="isLoading" class="flex items-center justify-center">
              <svg class="animate-spin h-5 w-5 mr-2 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Signing in...
            </span>
          </button>
        </form>

        <!-- Test Credentials -->
        <div class="bg-amber-50 border-t border-amber-200 px-8 py-6">
          <p class="text-xs font-semibold text-gray-700 mb-3 flex items-center">
            <svg class="w-4 h-4 mr-1.5 text-amber-600" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
            </svg>
            Test Credentials
          </p>
          <div class="space-y-2 text-xs">
            <div class="flex items-center justify-between p-2 bg-white rounded border border-gray-200">
              <span class="font-medium text-gray-600">Admin:</span>
              <code class="text-orange-700 font-mono">admin / admin123</code>
            </div>
            <div class="flex items-center justify-between p-2 bg-white rounded border border-gray-200">
              <span class="font-medium text-gray-600">Sponsor:</span>
              <code class="text-orange-700 font-mono">sponsor / sponsor123</code>
            </div>
          </div>
        </div>
      </div>

      <!-- Additional Info -->
      <div class="text-center mt-6">
        <p class="text-sm text-gray-600">
          Don't have an account?
          <a href="#" class="text-orange-600 hover:text-orange-700 font-semibold ml-1">Contact Administrator</a>
        </p>
      </div>
    </div>
  </section>

  <app-site-footer></app-site-footer>
</div>
