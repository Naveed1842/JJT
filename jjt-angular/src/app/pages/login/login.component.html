<div class="min-h-screen bg-[#0B1512] flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="mb-8 text-center">
      <img
        src="assets/images/jj-FINAL-LOGO.png"
        alt="Junior Jinnah Trust"
        class="mx-auto h-14 w-auto object-contain"
      />
    </div>

    <div class="rounded-2xl border border-[#2B3A33] bg-[#0D1C16] p-8 shadow-xl">
      <h1 class="mb-6 text-center text-xl font-semibold text-amber-100">Sign in to your account</h1>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-4">
        <div>
          <label for="email" class="mb-1 block text-sm text-amber-200/70">Email</label>
          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            required
            autocomplete="email"
            class="w-full rounded-lg border border-[#2B3A33] bg-[#0B1512] px-4 py-3 text-sm text-amber-50 placeholder-amber-200/30 focus:border-amber-400 focus:outline-none"
            placeholder="you@example.com"
          />
        </div>

        <div>
          <label for="password" class="mb-1 block text-sm text-amber-200/70">Password</label>
          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
            class="w-full rounded-lg border border-[#2B3A33] bg-[#0B1512] px-4 py-3 text-sm text-amber-50 placeholder-amber-200/30 focus:border-amber-400 focus:outline-none"
            placeholder="••••••••"
          />
        </div>

        <div *ngIf="error" class="rounded-lg border border-red-800/50 bg-red-950/50 px-4 py-3 text-sm text-red-300">
          {{ error }}
        </div>

        <button
          type="submit"
          [disabled]="loading || !loginForm.form.valid"
          class="w-full rounded-xl bg-gradient-to-r from-[#C38A2E] via-[#E2B763] to-[#C38A2E] py-3 text-sm font-semibold text-[#2B1B0B] shadow-lg transition hover:opacity-90 disabled:opacity-50"
        >
          <span *ngIf="!loading">Sign in</span>
          <span *ngIf="loading">Signing in…</span>
        </button>
      </form>
    </div>
  </div>
</div>
