name: CI

on:
  push:
  pull_request:

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    name: Backend — Build, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build & run tests (with coverage)
        run: ./mvnw verify -B
        env:
          TESTCONTAINERS_RYUK_DISABLED: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: target/surefire-reports/
          retention-days: 14

  # ── OWASP dependency scan (weekly + on-demand, not every push) ─────────────
  owasp:
    name: OWASP Dependency Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[owasp]')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Run OWASP dependency check
        run: ./mvnw dependency-check:check -B
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check-report.*
          retention-days: 30

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Build & Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jjt-angular

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: jjt-angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Build (production)
        run: npx ng build --configuration=production

  # ── Docker build verification ──────────────────────────────────────────────
  docker:
    name: Docker — Image Build
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t jjt-platform:${{ github.sha }} .

  # ── E2E tests (only on main and PRs targeting main) ───────────────────────
  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jjt
          POSTGRES_USER: jjt
          POSTGRES_PASSWORD: jjt
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Start backend
        run: ./mvnw spring-boot:run -DskipTests &
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/jjt
          SPRING_DATASOURCE_USERNAME: jjt
          SPRING_DATASOURCE_PASSWORD: jjt
          JWT_SECRET: ci-only-secret-key-minimum-64-characters-long-for-hs512-algorithm

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: jjt-angular/package-lock.json

      - name: Install frontend deps
        working-directory: jjt-angular
        run: npm ci

      - name: Install Playwright browsers
        working-directory: jjt-angular
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: jjt-angular
        run: npx ng serve --configuration=development &

      - name: Wait for services to be ready
        run: |
          npx wait-on http://localhost:8080/actuator/health http://localhost:4200 --timeout 120000

      - name: Run Playwright tests
        working-directory: jjt-angular
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:4200
          E2E_API_URL: http://localhost:8080

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: jjt-angular/playwright-report/
          retention-days: 14
