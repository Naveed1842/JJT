name: CD — Staging

on:
  push:
    branches: [main]

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: staging
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build JAR
        run: ./mvnw package -DskipTests -B

      # ── Deploy backend to Heroku staging ────────────────────────────────────
      - name: Deploy backend → Heroku staging
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ vars.HEROKU_APP_STAGING }}
          heroku_email: ${{ vars.HEROKU_EMAIL }}
          buildpack: https://github.com/heroku/heroku-buildpack-java

      - name: Wait for staging to be healthy
        run: |
          echo "Waiting for staging backend..."
          for i in $(seq 1 12); do
            STATUS=$(curl -sf "${{ vars.STAGING_API_URL }}/actuator/health" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "UP" ]; then
              echo "Staging is UP"
              exit 0
            fi
            echo "Attempt $i/12 — sleeping 10s..."
            sleep 10
          done
          echo "Staging health check timed out" && exit 1

      # ── Smoke tests against staging ─────────────────────────────────────────
      - name: Smoke test — health endpoint
        run: |
          curl -sf "${{ vars.STAGING_API_URL }}/actuator/health" | grep -q '"status":"UP"'

      - name: Smoke test — unauthenticated list returns 200
        run: |
          curl -sf "${{ vars.STAGING_API_URL }}/api/org/children" -o /dev/null

      - name: Smoke test — login returns token
        run: |
          RESPONSE=$(curl -sf -X POST "${{ vars.STAGING_API_URL }}/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${{ secrets.STAGING_ADMIN_EMAIL }}\",\"password\":\"${{ secrets.STAGING_ADMIN_PASSWORD }}\"}")
          echo "$RESPONSE" | grep -q "accessToken"

      # ── Deploy frontend to Firebase staging ─────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: jjt-angular/package-lock.json

      - name: Install frontend deps
        working-directory: jjt-angular
        run: npm ci

      - name: Build frontend (staging)
        working-directory: jjt-angular
        run: npx ng build --configuration=production

      - name: Deploy frontend → Firebase staging
        working-directory: jjt-angular
        run: npx firebase deploy --only hosting --project ${{ vars.FIREBASE_PROJECT_STAGING }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
