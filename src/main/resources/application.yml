spring:
  application:
    name: jjt-platform

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jjt}
    username: ${SPRING_DATASOURCE_USERNAME:jjt}
    password: ${SPRING_DATASOURCE_PASSWORD:jjt}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}

spring.servlet.multipart:
  max-file-size: 20MB
  max-request-size: 22MB

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.1
  environment: ${SPRING_PROFILES_ACTIVE:local}
  enabled: ${SENTRY_ENABLED:false}

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-minimum-256-bits-long-must-change-in-production-now}
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}

admin:
  default-email: ${ADMIN_EMAIL:admin@jjt.org}
  default-password: ${ADMIN_PASSWORD:Admin@JJT2024!}

jjt:
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:false}
    from-email: ${NOTIFICATION_FROM_EMAIL:noreply@sponsorone.app}
    from-name: ${NOTIFICATION_FROM_NAME:Junior Jinnah Trust}

  org:
    slug: ${JJT_ORG_SLUG:jjt}
    name: ${JJT_ORG_NAME:Junior Jinnah Trust}
    base-currency: ${JJT_ORG_BASE_CURRENCY:PKR}

  fund:
    initial-balance: ${JJT_FUND_INITIAL_BALANCE:0.00}
    min-reserve: ${JJT_FUND_MIN_RESERVE:20000.00}

  payment:
    due-day: ${JJT_PAYMENT_DUE_DAY:15}