spring:
  application:
    name: jjt-platform

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jjt}
    username: ${SPRING_DATASOURCE_USERNAME:jjt}
    password: ${SPRING_DATASOURCE_PASSWORD:jjt}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-minimum-256-bits-long-must-change-in-production-now}
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}

admin:
  default-email: ${ADMIN_EMAIL:admin@jjt.org}
  default-password: ${ADMIN_PASSWORD:Admin@JJT2024!}

jjt:
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:false}
    from-email: ${NOTIFICATION_FROM_EMAIL:noreply@sponsorone.app}
    from-name: ${NOTIFICATION_FROM_NAME:Junior Jinnah Trust}

  org:
    slug: ${JJT_ORG_SLUG:jjt}
    name: ${JJT_ORG_NAME:Junior Jinnah Trust}
    base-currency: ${JJT_ORG_BASE_CURRENCY:PKR}

  fund:
    initial-balance: ${JJT_FUND_INITIAL_BALANCE:0.00}
    min-reserve: ${JJT_FUND_MIN_RESERVE:20000.00}

  payment:
    due-day: ${JJT_PAYMENT_DUE_DAY:15}

media:
  storage:
    provider: ${MEDIA_STORAGE_PROVIDER:local}
    upload-dir: ${MEDIA_UPLOAD_DIR:${java.io.tmpdir}/jjt-media}
    local-base-url: ${MEDIA_LOCAL_BASE_URL:http://localhost:8080}
    max-upload-size-bytes: ${MEDIA_MAX_UPLOAD_BYTES:52428800}
    # S3 (production only — ignored when provider=local)
    bucket: ${MEDIA_S3_BUCKET:jjt-media-prod}
    cdn-base-url: ${MEDIA_CDN_BASE_URL:https://cdn.sponsorone.app}
    region: ${MEDIA_S3_REGION:eu-west-2}
  processing:
    thumbnail-sizes: [100, 300, 600]
    webp-quality: 82