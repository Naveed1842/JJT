spring:
  application:
    name: jjt-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jjt}
    username: ${SPRING_DATASOURCE_USERNAME:jjt}
    password: ${SPRING_DATASOURCE_PASSWORD:jjt}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:8080}
logging:
  level:
    root: INFO
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    # LEGACY: X-ROLE headers only
    # DUAL: Bearer token first, fallback to X-ROLE headers
    # FIREBASE: Bearer token only
    mode: ${AUTH_MODE:DUAL}

firebase:
  auth:
    service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
    project-id: ${FIREBASE_PROJECT_ID:}
