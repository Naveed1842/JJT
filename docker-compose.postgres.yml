version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: jjt
      POSTGRES_USER: jjt
      POSTGRES_PASSWORD: jjt
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
#      - ./db:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jjt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
