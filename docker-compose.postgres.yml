version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: jjt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jjt
      POSTGRES_USER: jjt
      POSTGRES_PASSWORD: jjt
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
